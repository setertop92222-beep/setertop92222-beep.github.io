<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harry Craft</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .overlay {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            background: rgba(0, 0, 0, 0.65);
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            padding: 45px 40px 35px;
            border-radius: 24px;
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }
        .logo {
            text-align: center;
            font-size: 42px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3), 3px 3px 0 #8b6f00;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        .logo span { color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
        label {
            color: #e0e0e0;
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        input, textarea {
            width: 100%;
            padding: 13px 15px;
            margin-bottom: 18px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: rgba(255,255,255,0.92);
            font-size: 15px;
            transition: 0.3s;
            outline: none;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
        }
        textarea {
            height: 85px;
            resize: vertical;
        }
        .checkbox-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 8px 0 22px;
            padding: 10px 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .checkbox-wrap input {
            width: 22px;
            height: 22px;
            margin: 0;
            cursor: pointer;
            accent-color: #ffd700;
            flex-shrink: 0;
        }
        .checkbox-wrap label {
            color: #ddd;
            cursor: pointer;
            margin: 0;
            font-size: 14px;
        }
        .checkbox-wrap label a {
            color: #ffd700;
            text-decoration: underline;
        }
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #555;
            color: #999;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 700;
            cursor: not-allowed;
            opacity: 0.5;
            transition: 0.3s;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .submit-btn.active {
            cursor: pointer;
            opacity: 1;
            background: linear-gradient(135deg, #ffd700, #f5a623);
            color: #1a1a2e;
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3);
        }
        .submit-btn.active:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(255, 215, 0, 0.4);
        }
        .submit-btn.active:active {
            transform: translateY(0);
        }
        #success {
            display: none;
            text-align: center;
            padding: 30px 20px;
        }
        #success .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        #success h2 {
            color: #8eff8e;
            font-size: 26px;
            margin-bottom: 8px;
        }
        #success p {
            color: #ccc;
            font-size: 16px;
        }
        #success a {
            display: inline-block;
            margin-top: 20px;
            color: #ffd700;
            text-decoration: none;
            padding: 10px 30px;
            border: 2px solid #ffd700;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
        }
        #success a:hover {
            background: #ffd700;
            color: #1a1a2e;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.2);
            font-size: 12px;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card { animation: fadeUp 0.6s ease-out; }
        @media (max-width: 500px) {
            .card { padding: 30px 20px; }
            .logo { font-size: 32px; }
        }
        /* Стиль для поля с токеном */
        .token-hint {
            color: #ff6b6b;
            font-size: 12px;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(255,0,0,0.1);
            border-radius: 8px;
            border-left: 3px solid #ff6b6b;
        }
        .token-hint code {
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 4px;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="card" id="formCard">
            <div class="logo">⚔️ Harry<span>Craft</span></div>

            <!-- Подсказка про токен (можно убрать после настройки) -->
            <div class="token-hint">
                ⚠️ Вставьте свой GitHub токен в код (строка 208)
            </div>

            <form id="applyForm">
                <label>🎮 Ваш ник в Minecraft</label>
                <input type="text" id="nickname" placeholder="Введите ник..." required>

                <label>❓ Зачем вы присоединяетесь к проекту?</label>
                <textarea id="reason" placeholder="Напишите причину..." required></textarea>

                <div class="checkbox-wrap">
                    <input type="checkbox" id="agree">
                    <label for="agree">Я принимаю <a href="#">правила сервера</a></label>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn" disabled>Подать заявку</button>
            </form>
            <div class="footer">© Harry Craft 2026</div>
        </div>

        <div id="success">
            <div class="icon">✅</div>
            <h2>Заявка подана!</h2>
            <p>Администратор рассмотрит её в ближайшее время</p>
            <a href="#" onclick="location.reload();">🔄 Подать ещё</a>
        </div>
    </div>

    <script>
        // ============================================================
        //  НАСТРОЙКИ — ЗАМЕНИТЕ НА СВОИ ДАННЫЕ
        // ============================================================
        const DATA_REPO_OWNER = "setertop92222-beep";              // Ваш логин GitHub
        const DATA_REPO_NAME = "harrycraft-data";         // Репозиторий для данных
        const FILE_PATH = "applications.json";            // Файл с заявками
        const GITHUB_TOKEN = "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";                 // Ваш токен

        // ============================================================

        const agreeCheck = document.getElementById('agree');
        const submitBtn = document.getElementById('submitBtn');
        const form = document.getElementById('applyForm');
        const formCard = document.getElementById('formCard');
        const successDiv = document.getElementById('success');

        // Активация кнопки
        agreeCheck.addEventListener('change', function() {
            if (this.checked) {
                submitBtn.classList.add('active');
                submitBtn.disabled = false;
            } else {
                submitBtn.classList.remove('active');
                submitBtn.disabled = true;
            }
        });

        // Функция для работы с GitHub API
        async function saveToGitHub(data) {
            const url = `https://api.github.com/repos/${DATA_REPO_OWNER}/${DATA_REPO_NAME}/contents/${FILE_PATH}`;
            
            // Пытаемся получить существующий файл
            let sha = null;
            let existingData = [];
            
            try {
                const getResponse = await fetch(url, {
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (getResponse.ok) {
                    const fileData = await getResponse.json();
                    sha = fileData.sha;
                    const content = atob(fileData.content);
                    existingData = JSON.parse(content);
                } else if (getResponse.status !== 404) {
                    throw new Error('Ошибка загрузки файла');
                }
            } catch (e) {
                // Если файла нет — просто создадим новый
                console.log('Создаём новый файл');
            }

            // Добавляем новую заявку
            existingData.push(data);

            // Сохраняем обратно
            const payload = {
                message: `Новая заявка от ${data.nickname}`,
                content: btoa(JSON.stringify(existingData, null, 2))
            };
            if (sha) payload.sha = sha;

            const putResponse = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify(payload)
            });

            if (!putResponse.ok) {
                const error = await putResponse.json();
                throw new Error(error.message || 'Ошибка сохранения');
            }

            return true;
        }

        // Отправка заявки
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const nickname = document.getElementById('nickname').value.trim();
            const reason = document.getElementById('reason').value.trim();

            if (!nickname || !reason) {
                alert('Заполните все поля!');
                return;
            }

            // Создаём заявку
            const newApp = {
                id: Date.now().toString(),
                nickname: nickname,
                reason: reason,
                status: "new",
                date: new Date().toISOString()
            };

            try {
                await saveToGitHub(newApp);
                formCard.style.display = 'none';
                successDiv.style.display = 'block';
            } catch (error) {
                alert('❌ Ошибка: ' + error.message);
                console.error(error);
            }
        });
    </script>
</body>
</html>
